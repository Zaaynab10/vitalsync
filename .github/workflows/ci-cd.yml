name: CI/CD Pipeline VitalSync

# Declencheurs :
# - push sur develop : pour valider chaque contribution en cours de developpement
# - pull_request vers main : pour garantir que rien de casse n'atteint la production
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  # --- Etape 1 : Lint et Tests ---
  lint-and-test:
    name: Lint and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Installation des dependances
        working-directory: backend
        run: npm ci

      - name: Installation et configuration ESLint
        working-directory: backend
        run: |
          npm install --save-dev eslint@8.57.0
          echo '{"env":{"node":true,"es2021":true},"extends":"eslint:recommended","parserOptions":{"ecmaVersion":"latest"}}' > .eslintrc.json

      - name: Execution du linter ESLint
        working-directory: backend
        run: npx eslint server.js --max-warnings=0

      - name: Execution des tests Jest
        working-directory: backend
        run: npm test

  # --- Etape 2 : Build et Push Docker ---
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Le tag par SHA de commit garantit l'immutabilite et la tracabilite :
      # chaque image correspond exactement a un etat precis du code.
      # Le tag "latest" est ambigu et peut pointer vers des versions differentes
      # selon le moment, ce qui rend les rollbacks difficiles.
      - name: Build et push image back-end
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vitalsync-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/vitalsync-backend:latest

      - name: Build et push image front-end
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vitalsync-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/vitalsync-frontend:latest

  # --- Etape 3 : Deploiement staging ---
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Creation du fichier .env pour staging
        run: |
          echo "POSTGRES_USER=vitalsync_user" >> .env
          echo "POSTGRES_PASSWORD=testpassword" >> .env
          echo "POSTGRES_DB=vitalsync" >> .env
          echo "DATABASE_URL=postgresql://vitalsync_user:testpassword@database:5432/vitalsync" >> .env
          echo "NODE_ENV=staging" >> .env

      - name: Lancement des services via Docker Compose
        run: docker compose up -d --build

      - name: Attente du demarrage du back-end (10 secondes)
        run: sleep 10

      # Health check : verifie que le back-end repond correctement apres deploiement.
      # Si le back-end ne repond pas (code != 200 ou statut != "ok"), la pipeline
      # echoue immediatement et empeche un deploiement defaillant d'atteindre la prod.
      - name: Health check du back-end
        run: |
          RESPONSE=$(curl -s http://localhost:3000/health)
          echo "Reponse : $RESPONSE"
          STATUS=$(echo $RESPONSE | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
          if [ "$STATUS" != "ok" ]; then
            echo "Health check echoue : statut = $STATUS"
            exit 1
          fi
          echo "Health check reussi"

      - name: Arret des services de staging
        if: always()
        run: docker compose down
