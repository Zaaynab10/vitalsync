server {
    listen 80;

    # Servir les fichiers statiques du front-end
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le back-end pour toutes les requetes /api/*
    # Le proxy_pass permet au front-end d'appeler le back-end sans probleme CORS,
    # en faisant transiter les requetes par Nginx qui agit comme reverse proxy.
    # Le navigateur croit appeler le meme domaine, Nginx redirige en interne.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
