version: "3.9"

# Reseau bridge personnalise : isole les conteneurs VitalSync du reste des conteneurs
# Docker sur la machine. Sans reseau dedie, tous les conteneurs partagent le reseau
# bridge par defaut et peuvent se voir mutuellement, ce qui reduit l'isolation.
# Avec un reseau nomme, seuls les services declares dans ce fichier peuvent communiquer.
networks:
  vitalsync-network:
    driver: bridge

# Volume persistant pour PostgreSQL : sans ce volume, toutes les donnees de la base
# sont perdues des que le conteneur est supprime (docker-compose down).
# Avec le volume, les donnees survivent aux redemarrages et suppressions de conteneurs.
volumes:
  postgres-data:

services:
  database:
    image: postgres:15-alpine
    container_name: vitalsync-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vitalsync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vitalsync-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "3000:3000"
    networks:
      - vitalsync-network
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vitalsync-frontend
    ports:
      - "80:80"
    networks:
      - vitalsync-network
    depends_on:
      - backend
